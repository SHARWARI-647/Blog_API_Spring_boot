spring.application.name=blog

# ===============================
# PostgreSQL - Supabase
# ===============================

spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.hjzqblljljhqvzjgubxg
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===============================
# File Upload
# ===============================

file.upload-dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Supabase Storage
# ===============================

supabase.url=https://hjzqblljljhqvzjgubxg.supabase.co
supabase.bucket=blogImage
supabase.service-key=${SUPABASE_SERVICE_KEY}



